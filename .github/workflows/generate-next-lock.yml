name: Generate Next lockfile

on:
  push:
    branches: [command-portal-v2-preview]
    paths: [.github/workflows/generate-next-lock.yml]

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install next@16.3.4 --package-lock-only --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: next-16.3.4-lockfile
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
