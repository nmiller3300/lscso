name: Vercel Production Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger Vercel production deployment
        run: |
          curl --fail-with-body --request POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
