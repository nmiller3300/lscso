name: Vercel Production Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger fresh Vercel production deployment
        shell: bash
        run: |
          set -euo pipefail
          HOOK="${{ secrets.VERCEL_DEPLOY_HOOK }}"
          SEP='?'
          if [[ "$HOOK" == *\?* ]]; then
            SEP='&'
          fi
          curl \
            --fail-with-body \
            --retry 2 \
            --retry-delay 3 \
            --max-time 30 \
            --request POST \
            "${HOOK}${SEP}buildCache=false"
