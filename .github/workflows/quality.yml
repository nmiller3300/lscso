name: Quality

on:
  push:
    branches: [main, command-portal-v2-preview]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run audit:portal
      - run: npx tsc --noEmit
      - run: npm run build
